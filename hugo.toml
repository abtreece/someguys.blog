baseURL = "https://someguys.blog/"
locale = "en-us"
title = "Some Guys Blog"
theme = "PaperMod"

enableRobotsTXT = true
enableGitInfo = true
enableEmoji = true
buildDrafts = false
buildFuture = false
buildExpired = false

[outputs]
  home = ["HTML", "RSS"]

[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "monokai"
  [markup.goldmark.renderer]
    unsafe = true

[params]
  env = "production"
  description = "Yet another tech blog of some guy."
  author = "Britt Treece"
  since = 2017
  mainSections = ["posts"]
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = false
  ShowWordCount = false
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowToc = false
  comments = false

  # Wordmark. Rendered as plain text by PaperMod; the trailing period is
  # appended via CSS ::after so it can carry the accent color.
  [params.label]
    text = "Some Guys Blog"

  [params.assets]
    disableHLJS = true
    disableFingerprinting = false
    favicon = "/favicon.svg"
    favicon16x16 = "/favicon.svg"
    favicon32x32 = "/favicon.svg"
    apple_touch_icon = "/img/avatar-icon.png"

  [params.profileMode]
    enabled = false

  [params.homeInfoParams]
    Content = """
At 2am during an outage, the answer is almost always on somebody's blog: half-formatted, three years old, addressing the exact thing on fire. Twenty years in, I've written my share of those posts too, mostly on internal wikis nobody else can read. This is where I'm writing the public ones.
"""

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/abtreece"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/abtreece"

  [[params.socialIcons]]
    name = "x"
    url = "https://x.com/abtreece"

  [[params.socialIcons]]
    name = "bluesky"
    url = "https://bsky.app/profile/abtreece.bsky.social"

  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

[[menu.main]]
    name = "Home"
    url = "/"
    weight = 1

[[menu.main]]
    name = "Posts"
    url = "/posts/"
    weight = 2
