[build]
publish = "public"
command = "hugo --gc --minify"

[build.environment]
HUGO_VERSION = "0.165.0"

[context.production.environment]
HUGO_ENV = "production"
HUGO_ENABLEGITINFO = "true"

[context.deploy-preview]
command = "hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"

# Plausible analytics proxy (first-party paths to avoid ad-block filtering)
[[redirects]]
from = "/sg/js/script.js"
to = "https://plausible.io/js/pa-BimJpMh7vl8AK95W2Axub.js"
status = 200
force = true

[[redirects]]
from = "/sg/api/event"
to = "https://plausible.io/api/event"
status = 200
force = true

# Security headers
[[headers]]
for = "/*"
[headers.values]
  X-Frame-Options = "DENY"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
for = "/img/*"
[headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/css/*"
[headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/js/*"
[headers.values]
  Cache-Control = "public, max-age=31536000, immutable"
