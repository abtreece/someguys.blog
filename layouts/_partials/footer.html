{{- if not (.Param "hideFooter") }}
<footer class="footer">
    {{- if not site.Params.footer.hideCopyright }}
        <span class="footer-copyright">&copy; {{ site.Params.since | default 2017 }}&ndash;{{ now.Year }} <a href="{{ "" | absLangURL }}">{{ site.Title }}</a></span>
    {{- end }}
    {{- if site.Params.socialIcons }}
        {{ partial "social_icons.html" (dict "align" "right") }}
    {{- end }}
</footer>
{{- end }}
