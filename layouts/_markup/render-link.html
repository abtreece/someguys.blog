{{- $dest := .Destination -}}
{{- $u := urls.Parse $dest -}}
{{- $siteHost := (urls.Parse .Page.Site.BaseURL).Host -}}
{{- $external := and $u.Host (ne $u.Host $siteHost) -}}
<a href="{{ $dest | safeURL }}"
  {{- with .Title }} title="{{ . }}"{{ end -}}
  {{- if $external }} target="_blank" rel="noopener noreferrer"{{ end -}}
>{{ .Text | safeHTML }}</a>
